<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- soft background disc -->
  <circle cx="200" cy="200" r="190" fill="#FAF7F0"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#E9E4D8" stroke-width="1.5"/>

  <!-- tooth outline -->
  <path
    d="M200 100
       C165 100 140 122 140 158
       C140 190 152 212 158 244
       C164 276 170 306 190 306
       C206 306 208 272 220 268
       C232 264 234 296 250 300
       C266 304 274 278 280 246
       C286 214 260 190 260 158
       C260 122 235 100 200 100Z"
    fill="none"
    stroke="#12213F"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- root canal lines for texture -->
  <path d="M190 210 C186 232 182 254 178 276" stroke="#12213F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M212 210 C216 232 220 254 224 276" stroke="#12213F" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- magnifying glass -->
  <g>
    <circle cx="235" cy="185" r="58" fill="rgba(250,247,240,0.65)" stroke="#C9A227" stroke-width="7"/>
    <line x1="277" y1="227" x2="325" y2="275" stroke="#C9A227" stroke-width="10" stroke-linecap="round"/>
    <line x1="277" y1="227" x2="325" y2="275" stroke="#12213F" stroke-width="10" stroke-linecap="round" opacity="0.15"/>
  </g>

  <!-- magnified detail marks inside lens -->
  <g stroke="#12213F" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <path d="M212 165 C218 172 224 178 230 186"/>
    <path d="M245 160 C250 168 254 176 256 186"/>
