<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="200" cy="200" r="190" fill="#FAF7F0"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#E9E4D8" stroke-width="1.5"/>

  <!-- clock face -->
  <circle cx="200" cy="190" r="92" fill="#ffffff" stroke="#12213F" stroke-width="6"/>

  <!-- hour ticks -->
  <g stroke="#12213F" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="200" y1="106" x2="200" y2="118"/>
    <line x1="200" y1="262" x2="200" y2="274"/>
    <line x1="284" y1="190" x2="272" y2="190"/>
    <line x1="116" y1="190" x2="128" y2="190"/>
  </g>

  <!-- relaxed hands: slow, wide angle suggesting unhurried time -->
  <line x1="200" y1="190" x2="200" y2="142" stroke="#12213F" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="190" x2="238" y2="210" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="190" r="7" fill="#12213F"/>

  <!-- gentle steam/calm curls, top right, suggesting a relaxed pace (like tea steam) -->
  <path d="M275 100 C279 92 287 92 291 100" stroke="#C9A227" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M290 112 C294 104 302 104 306 112" stroke="#C9A227" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- comfortable chair silhouette beneath the clock -->
  <path
    d="M150 320
       C150 300 160 292 176 292
       L224 292
       C240 292 250 300 250 320
       L250 330
       L150 330 Z"
    fill="#12213F"
    opacity="0.9"
  />
  <rect x="150" y="330" width="14" height="20" rx="4" fill="#12213F" opacity="0.9"/>
  <rect x="236" y="330" width="14" height="20" rx="4" fill="#12213F" opacity="0.9"/>
</svg>
