<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="blurEdge" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- left panel: without magnification -->
  <rect x="0" y="0" width="300" height="300" rx="18" fill="#FAF7F0" stroke="#E9E4D8"/>
  <text x="150" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#9AA4BD">WITHOUT MAGNIFICATION</text>

  <path
    d="M150 70
       C122 70 100 90 100 120
       C100 146 110 164 115 190
       C120 216 125 240 142 240
       C156 240 158 212 168 208
       C178 204 180 232 194 236
       C208 240 215 218 220 192
       C225 166 202 146 202 120
       C202 90 178 70 150 70Z"
    fill="none"
    stroke="#12213F"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
    filter="url(#blurEdge)"
  />
  <circle cx="176" cy="150" r="5" fill="#C0392B" opacity="0.5" filter="url(#blurEdge)"/>
  <text x="150" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#6B7280">Margins estimated, decay can hide</text>

  <!-- right panel: with magnification -->
  <rect x="340" y="0" width="300" height="300" rx="18" fill="#12213F"/>
  <text x="490" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#E7CB6B">WITH MAGNIFICATION</text>

  <path
    d="M490 70
       C462 70 440 90 440 120
       C440 146 450 164 455 190
       C460 216 465 240 482 240
       C496 240 498 212 508 208
       C518 204 520 232 534 236
       C548 240 555 218 560 192
       C565 166 542 146 542 120
       C542 90 518 70 490 70Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="516" cy="150" r="4" fill="#4CAF7D"/>
  <path d="M508 146 L514 152 L524 138" stroke="#4CAF7D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="490" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#D9DEEB">Margins sealed precisely, sharp detail</text>
</svg>
