<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="200" cy="200" r="190" fill="#FAF7F0"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#E9E4D8" stroke-width="1.5"/>

  <!-- sterilisation pouch -->
  <rect x="130" y="120" width="140" height="180" rx="14" fill="none" stroke="#12213F" stroke-width="6"/>
  <line x1="130" y1="160" x2="270" y2="160" stroke="#12213F" stroke-width="3" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- instrument silhouette inside pouch -->
  <path d="M175 200 L225 200 L220 260 L200 275 L180 260 Z" fill="#12213F" opacity="0.15"/>
  <line x1="200" y1="185" x2="200" y2="270" stroke="#12213F" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- shield with checkmark, overlapping bottom-right of pouch -->
