  <path d="M195 96 C199 86 209 86 213 96" stroke="#C9A227" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M230 100 C234 92 242 92 246 100" stroke="#C9A227" stroke-width="4" stroke-linecap="round" fill="none"/>
